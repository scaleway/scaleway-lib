name: 'Bootstrap'
description: 'Install dependencies, build packages and refresh the lockfile'

inputs:
  node-version:
    description: 'Node version to use (overrides node-version-file)'
    required: false
  registry-url:
    description: 'npm registry URL'
    required: false

runs:
  using: 'composite'
  steps:
    - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        runtime: ${{ inputs.node-version }}
        cache: true
        require-lockfile: true
    - run: pnpm build && pnpm install --frozen-lockfile
      shell: bash
