name: 'Bootstrap'
description: 'Install dependencies, build packages and refresh the lockfile'

inputs:
  node-version:
    description: 'Node version to use (overrides node-version-file)'
    required: false
  node-version-file:
    description: 'Path to a file containing the Node version'
    required: false
    default: '.nvmrc'
  registry-url:
    description: 'npm registry URL'
    required: false

runs:
  using: 'composite'
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Use Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version-file }}
        cache: 'pnpm'
        registry-url: ${{ inputs.registry-url }}
    - run: pnpm install --frozen-lockfile && pnpm build && pnpm install --frozen-lockfile
      shell: bash
