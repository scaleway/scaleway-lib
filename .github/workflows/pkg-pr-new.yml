name: Publish Preview

on:
  pull_request:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/bootstrap
      - run: pnpm exec pkg-pr-new publish --pnpm './packages/*' --commentWithSha
