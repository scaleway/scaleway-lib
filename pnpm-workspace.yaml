packages:
  - packages/*

registry: 'https://registry.npmjs.org/'

update:
  changeset: true

catalog:
  '@arethetypeswrong/core': 0.18.5
  '@changesets/changelog-github': 1.0.1
  '@changesets/cli': 3.0.3
  '@changesets/config': 4.0.1
  '@formatjs/icu-messageformat-parser': 3.5.23
  '@growthbook/growthbook-react': 2.2.0
  '@manypkg/cli': 0.25.1
  '@rudderstack/analytics-js': 3.36.1
  '@scaleway/sdk-client': 2.18.0
  '@scaleway/sdk-iam': 2.23.1
  '@segment/analytics-next': 1.84.4
  '@testing-library/jest-dom': 8.0.0
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.13
  '@types/node': 26.6.6
  '@types/react-dom': 19.3.0
  '@types/react': 19.3.0
  '@vitejs/plugin-react': 6.3.0
  '@vitest/coverage-istanbul': 5.1.1
  awesome-phonenumber: 7.8.0
  browserslist: 4.29.6
  cookie: 2.0.2
  date-fns: 4.4.0
  deepmerge-ts: 8.0.2
  filesize: 11.0.35
  happy-dom: 21.0.4
  history: 5.3.0
  intl-messageformat: 12.2.0
  jsdom: 31.0.1
  lint-staged: 17.6.1
  oxfmt: 0.79.0
  oxlint: 1.94.0
  oxlint-tsgolint: 7.0.2007
  publint: 0.3.25
  react: 19.3.1
  react-dom: 19.3.1
  read-pkg: 10.1.0
  regexparam: 3.0.0
  simple-git: 4.1.0
  tsdown: 0.23.7
  turbo: 2.11.13
  typescript: 7.1.0-dev.20261120.1
  use-deep-compare-effect: 1.8.1
  vitest: 5.1.1
  vitest-localstorage-mock: 0.1.3
  yaml: 2.9.1
  zod: 4.6.7
  '@testing-library/dom': 10.4.2
  pkg-pr-new: 0.0.94
  memfs: 4.80.1

catalogMode: strict
cleanupUnusedCatalogs: true

# Needed as we run a pnpm install after building packages
optimisticRepeatInstall: false
autoDedupe: true

allowBuilds:
  esbuild: true

peerDependencyRules:
  allowedVersions:
    '@types/react': 18 || 19
    react: 18 || 19
    react-dom: 18 || 19

savePrefix: ''

supportedArchitectures:
  cpu: [x64, arm64]
  os: [darwin, current]

minimumReleaseAgeExclude:
  - '@scaleway/sdk-*'
