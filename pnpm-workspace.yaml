packages:
  - packages/*

registry: 'https://registry.npmjs.org/'

update:
  changeset: true

catalog:
  '@arethetypeswrong/core': 0.18.5
  '@changesets/changelog-github': 1.0.1
  '@changesets/cli': 3.0.3
  '@changesets/config': 4.0.1
  '@formatjs/fast-memoize': 3.1.7
  '@formatjs/icu-messageformat-parser': 3.5.22
  '@growthbook/growthbook-react': 1.8.0
  '@manypkg/cli': 0.25.1
  '@rudderstack/analytics-js': 3.35.1
  '@scaleway/sdk-client': 2.16.0
  '@scaleway/sdk-iam': 2.21.3
  '@segment/analytics-next': 1.84.3
  '@testing-library/jest-dom': 7.0.1
  '@testing-library/react': 16.3.3
  '@testing-library/user-event': 14.6.8
  '@types/node': 26.6.5
  '@types/react-dom': 19.3.0
  '@types/react': 19.3.0
  '@vitejs/plugin-react': 6.1.2
  '@vitest/coverage-istanbul': 4.1.12
  awesome-phonenumber: 7.8.0
  browserslist: 4.29.4
  cookie: 2.0.1
  date-fns: 4.4.0
  deepmerge-ts: 8.0.2
  execa: 10.2.0
  filesize: 11.0.26
  happy-dom: 21.0.3
  history: 5.3.0
  intl-messageformat: 12.1.4
  jsdom: 30.1.3
  lint-staged: 17.6.0
  oxfmt: 0.74.0
  oxlint: 1.89.0
  oxlint-tsgolint: 7.0.2004
  publint: 0.3.25
  query-string: 9.5.1
  react: 19.3.1
  react-dom: 19.3.1
  read-pkg: 10.1.0
  regexparam: 3.0.0
  simple-git: 4.0.2
  tsdown: 0.23.1
  turbo: 2.11.10
  typescript: 7.0.2
  use-deep-compare-effect: 1.8.1
  vitest: 4.1.12
  vitest-localstorage-mock: 0.1.2
  yaml: 2.9.1
  zod: 4.6.7
  '@testing-library/dom': 10.4.2
  pkg-pr-new: 0.0.91
  memfs: 4.80.0

catalogMode: strict
cleanupUnusedCatalogs: true

# Needed as we run a pnpm install after building packages
optimisticRepeatInstall: false
autoDedupe: true

allowBuilds:
  esbuild: true

peerDependencyRules:
  allowedVersions:
    '@types/react': 18 || 19
    react: 18 || 19
    react-dom: 18 || 19

savePrefix: ''

supportedArchitectures:
  cpu: [x64, arm64]
  os: [darwin, current]

minimumReleaseAgeExclude:
  - '@scaleway/sdk-*'
