  "@vitejs/plugin-react": 6.1.0
  "@vitest/coverage-istanbul": 4.1.10
  awesome-phonenumber: 7.8.0
  browserslist: 4.28.8
  chalk: 6.0.0
  cookie: 2.0.1
  date-fns: 4.4.0
  deepmerge-ts: 8.0.1
  execa: 10.0.1
  filesize: 11.0.22
  happy-dom: 20.11.6
  history: 5.3.0
  international-types: 0.8.1
  intl-messageformat: 11.2.14
  jsdom: 30.0.1
  lint-staged: 17.3.0
  oxfmt: 0.64.0
  oxlint: 1.78.0
  oxlint-tsgolint: 7.0.2001
  publint: 0.3.24
  query-string: 9.5.0
  react: 19.2.8
  react-dom: 19.2.8
  read-pkg: 10.1.0
  regexparam: 3.0.0
  simple-git: 3.36.0
  tinyglobby: 0.2.17
  tsdown: 0.22.14
  turbo: 2.10.11
  typescript: 7.0.2
  use-deep-compare-effect: 1.8.1
